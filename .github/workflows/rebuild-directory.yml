name: rebuild Verglas directory

on:
  push:
    branches: [main]
    paths:
      - 'residents/**'
      - 'tools/generate-directory.mjs'
      - 'tools/lib.mjs'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate directory
        run: node tools/generate-directory.mjs

      - name: Commit generated directory when changed
        run: |
          if git diff --quiet -- DIRECTORY.md; then
            echo "Directory is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DIRECTORY.md
          git commit -m "chore: rebuild Verglas directory"
          git push
